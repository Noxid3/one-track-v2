<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OneTrack — RCS Sg Bakap SB</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B1622;
    --bg-2: #0F1E2E;
    --card: #142839;
    --card-hi: #17304A;
    --line: rgba(255,255,255,0.07);
    --text: #EDF1F5;
    --text-dim: #93A5B8;
    --text-faint: #5C6E80;
    --good: #33D6A6;
    --good-dim: rgba(51,214,166,0.16);
    --warn: #F5B84E;
    --warn-dim: rgba(245,184,78,0.16);
    --bad: #F0685B;
    --bad-dim: rgba(240,104,91,0.16);
    --gold: #E8C468;
    --silver: #C9D3DC;
    --bronze: #D89A6A;
    --shell-red: #EC1C24;
    --brand: #FBCE07;
    --brand-dim: rgba(251,206,7,0.14);
    --flame: #F5824E;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    /* Background texture — drop a seamless/tileable image at ./assets/texture-dark.png
       and it fills the whole page automatically, no other code changes needed.
       If that file is missing, only the two color washes below show (nothing breaks). */
    background-image:
      url('./assets/texture-dark.png'),
      radial-gradient(1200px 500px at 15% -10%, rgba(51,214,166,0.06), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(232,196,104,0.05), transparent 55%);
    background-repeat: repeat, no-repeat, no-repeat;
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    padding: 28px 20px 60px;
    min-height:100vh;
  }
  .wrap{ max-width: 1160px; margin: 0 auto; }

  header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 26px; flex-wrap:wrap; gap:14px;
  }
  .brand-row{ display:flex; align-items:center; gap:10px; }
  .brand-logo{ height:42px; width:auto; display:none; }
  .brand{ display:flex; align-items:baseline; gap:14px; }
  .brand h1{
    font-family:'Space Grotesk', sans-serif;
    font-size: 34px; font-weight:700; letter-spacing:-0.02em;
    color: var(--text);
    position:relative;
  }
  .brand h1::after{
    content:''; position:absolute; left:1px; bottom:-4px; width:34px; height:3px;
    border-radius:2px; background: var(--brand);
  }
  .brand h1 span{ color: var(--shell-red); }
  .brand .sub{ color: var(--text-dim); font-size: 13.5px; font-weight:500; }
  .daterange{
    background: var(--card);
    border:1px solid rgba(251,206,7,0.18);
    padding: 9px 16px;
    border-radius: 100px;
    font-size: 13px;
    color: var(--text-dim);
    font-weight:600;
    letter-spacing:0.01em;
    display:flex; align-items:center; gap:8px;
  }
  .daterange::before{ content:''; width:6px; height:6px; border-radius:50%; background:var(--good); box-shadow:0 0 8px var(--good); }
  .insights-link{
    font-size:12.5px; font-weight:700; color: var(--text-dim);
    text-decoration:none; padding:9px 14px; border-radius:100px;
    background: var(--card); border:1px solid rgba(251,206,7,0.18);
  }

  /* PODIUM */
  .podium-card{
    background: linear-gradient(180deg, var(--card-hi), var(--card));
    border:1px solid var(--line);
    border-radius: 20px;
    padding: 26px 30px 0;
    margin-bottom: 18px;
    overflow:hidden;
    position:relative;
  }
  .podium-eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
    color: var(--text-faint); font-weight:600; margin-bottom:20px;
    display:flex; align-items:center; gap:7px;
  }
  .podium-eyebrow .icon{ width:14px; height:14px; color: var(--brand); }
  .podium{
    display:grid;
    grid-template-columns: 1fr 1fr 1fr;
    align-items:end;
    gap: 16px;
    padding-top: 8px;
  }
  .stand{ display:flex; flex-direction:column; align-items:center; text-align:center; }
  .dept-tag{
    font-size:10.5px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase;
    color: var(--text-faint); margin-bottom:10px;
  }
  .avatar-wrap{ position:relative; display:flex; align-items:center; justify-content:center; margin-bottom:8px; }
  .wreath{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none; z-index:1; }
  .wreath svg{ width:100%; height:100%; display:block; }
  .wreath ellipse, .wreath path{ fill: currentColor; stroke: currentColor; }
  .wreath path{ fill:none; stroke-width:1.4; opacity:0.85; }
  /* All three stands are equal — each is #1 within their own department, so
     none of them get a "taller" or more prominent treatment than the others. */
  .stand .wreath{ width:104px; height:104px; color: var(--brand); }
  .avatar{
    width:70px; height:70px; border-radius:50%;
    background: linear-gradient(145deg,#2A3F52,#1A2C3C);
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px;
    color:var(--text); border:3px solid var(--brand); box-shadow:0 0 0 3px rgba(251,206,7,0.25);
    position:relative; z-index:2;
    overflow:hidden;
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
  .avatar .avatar-fallback{ display:none; align-items:center; justify-content:center; width:100%; height:100%; }
  .p-name{ font-weight:700; font-size:14.5px; margin-bottom:2px;}
  .p-score{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:12.5px; color:var(--good); margin-bottom:14px;}
  .block{
    width:100%; height:52px; border-radius: 10px 10px 0 0; position:relative;
    background: linear-gradient(180deg, rgba(251,206,7,0.20), rgba(251,206,7,0.05));
    border-top:2px solid var(--brand);
  }
  .block-rank{
    font-family:'IBM Plex Mono',sans-serif; font-weight:700; letter-spacing:0.08em; text-transform:uppercase;
    color: rgba(251,206,7,0.55); display:block; padding-top:16px; font-size:10.5px;
  }

  /* Any department champions beyond the top 3 — shown as simple chips, not forced onto the podium */
  .podium-overflow{
    flex-wrap:wrap; gap:10px; margin-top:18px; padding-top:16px;
    border-top:1px solid var(--line);
  }
  .champ-chip{
    display:flex; align-items:center; gap:10px;
    background: var(--card-hi); border:1px solid var(--line); border-radius:100px;
    padding:6px 14px 6px 6px;
  }
  .champ-chip .avatar-wrap{ margin-bottom:0; }
  .champ-chip .wreath{ display:none; }
  .champ-chip .avatar{ width:32px; height:32px; font-size:13px; border-width:2px; }
  .chip-dept{ font-size:9.5px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color: var(--text-faint); }
  .chip-name{ font-size:12.5px; font-weight:600; }

  .section-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
    color: var(--text-faint); font-weight:600;
    margin: 26px 0 12px 2px;
    display:flex; align-items:center; gap:8px;
  }
  .section-label::before{ content:''; width:10px; height:2px; background: var(--brand); border-radius:2px; flex-shrink:0; }

  /* small line-icon wrapper used for metric icons + momentum headers */
  .icon{ display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
  .icon svg{ width:100%; height:100%; }

  /* MOMENTUM ROW */
  .momentum{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .mom-card{
    background: var(--card);
    border:1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
  }
  .mom-head{
    display:flex; align-items:center; gap:8px;
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13.5px;
    margin-bottom: 10px;
  }
  .mom-head .ic{ font-size:15px; }
  .mom-row{
    display:flex; align-items:center; justify-content:space-between;
    padding: 7px 0;
    border-top: 1px solid var(--line);
    font-size: 13px;
  }
  .mom-row:first-of-type{ border-top:none; }
  .mom-name{ font-weight:600; color:var(--text); }
  .mom-val{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:12px; }
  .mom-val.up{ color: var(--good); }
  .mom-val.flame{ color: var(--flame); display:flex; align-items:center; gap:4px; }

  /* TRENDS SECTION */
  .trends{
    display:grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 12px;
  }
  .trend-card{
    background: var(--card);
    border:1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px 12px;
  }
  .trend-head{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom: 10px;
  }
  .trend-title{
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13.5px;
  }
  .trend-sub{ font-size:10.5px; color: var(--text-faint); font-weight:500; }
  .line-fill{ fill: url(#lineGrad); opacity:0.5; }
  .line-path{ fill:none; stroke: var(--good); stroke-width:2; }
  .line-dot{ fill: var(--bg); stroke: var(--good); stroke-width:2; }
  .line-dot.peak{ fill: var(--good); }
  .avg-line{ stroke: var(--text-faint); stroke-width:1; stroke-dasharray:3 3; }
  .axis-label{ font-family:'IBM Plex Mono',monospace; font-size:8.5px; fill: var(--text-faint); }

  .bar-chart{ display:flex; align-items:flex-end; gap:8px; height:120px; padding-top:10px; }
  .bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; }
  .bar-fill-el{ width:100%; border-radius: 5px 5px 2px 2px; position:relative; }
  .bar-fill-el.weekend{ background: linear-gradient(180deg, var(--good), rgba(51,214,166,0.5)); }
  .bar-fill-el.weekday{ background: linear-gradient(180deg, rgba(147,165,184,0.55), rgba(147,165,184,0.25)); }
  .bar-val{ font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:600; color: var(--text-dim); }
  .bar-day{ font-size:10px; font-weight:600; color: var(--text-faint); }
  .bar-col.weekend .bar-val{ color: var(--good); }
  .spotlight-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 14px;
  }
  .spotlight{
    background: var(--card);
    border:1px solid var(--line);
    border-radius: 14px;
    padding: 18px 20px;
    display:flex; align-items:center; gap:16px;
    position:relative;
    overflow:hidden;
  }
  .spotlight::before{
    content:''; position:absolute; inset:0 0 auto 0; height:3px;
  }
  .spotlight.bad::before{ background: var(--bad); }
  .spotlight.warn::before{ background: var(--warn); }
  .spot-tag{
    display:block;
    font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:0.08em;
    text-transform:uppercase; font-weight:600; color: var(--text-faint);
    margin-bottom: 3px;
  }
  .m-ring{ flex-shrink:0; width:56px; height:56px; position:relative; }
  .m-ring svg{ transform: rotate(-90deg); }
  .m-ring .bg{ stroke: rgba(255,255,255,0.08); }
  .m-ring .fg{ stroke-linecap:round; transition: stroke-dashoffset 0.3s; }
  .m-ring .pct{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:600;
  }
  .m-body{ flex:1; min-width:0; }
  .m-name{ font-size:13.5px; font-weight:600; color: var(--text-dim); margin-bottom:4px; display:flex; align-items:center; gap:6px;}
  .m-name .icon{ width:14px; height:14px; color: var(--text-faint); }
  .m-row{ display:flex; align-items:baseline; gap:6px; }
  .m-actual{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px; }
  .m-target{ font-size:11.5px; color: var(--text-faint); font-weight:500;}

  .good .fg{ stroke: var(--good); } .good .pct{ color: var(--good); }
  .warn .fg{ stroke: var(--warn); } .warn .pct{ color: var(--warn); }
  .bad  .fg{ stroke: var(--bad);  } .bad  .pct{ color: var(--bad); }

  /* COMPACT METRIC LIST (everything else) */
  .metric-list{
    background: var(--card);
    border:1px solid var(--line);
    border-radius: 14px;
    overflow:hidden;
  }
  .ml-row{
    display:flex; align-items:center; gap:12px;
    padding: 9px 18px;
    border-top: 1px solid var(--line);
  }
  .ml-row:first-child{ border-top:none; }
  .ml-name{ width: 150px; flex-shrink:0; font-size:12.5px; font-weight:600; color: var(--text-dim); display:flex; align-items:center; gap:8px; }
  .ml-name .icon{ width:15px; height:15px; color: var(--text-faint); }
  .ml-bar-track{
    flex:1; height:6px; border-radius:100px; background: rgba(255,255,255,0.06); overflow:hidden;
  }
  .ml-bar-fill{ height:100%; border-radius:100px; }
  .ml-bar-fill.good{ background: var(--good); }
  .ml-bar-fill.warn{ background: var(--warn); }
  .ml-bar-fill.bad{ background: var(--bad); }
  .ml-pct{
    width:42px; text-align:right; font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600; flex-shrink:0;
  }
  .ml-pct.good{ color: var(--good); }
  .ml-pct.warn{ color: var(--warn); }
  .ml-pct.bad{ color: var(--bad); }
  .ml-nums{
    width:110px; text-align:right; font-family:'IBM Plex Mono',monospace; font-size:11px; color: var(--text-faint); flex-shrink:0;
  }

  /* LEADERBOARD — simplified */
  .boards{
    display:grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
  }
  .board{
    background: var(--card);
    border:1px solid var(--line);
    border-radius: 14px;
    overflow:hidden;
  }
  .board-head{
    padding: 11px 14px 10px;
    border-bottom: 1px solid var(--line);
    font-family:'Space Grotesk',sans-serif;
    font-weight:600; font-size:13.5px;
  }
  .row{
    display:flex; align-items:center; gap:9px;
    padding: 7px 14px;
    border-top: 1px solid var(--line);
    font-size: 12.5px;
  }
  .row:first-of-type{ border-top:none; }
  .rk{
    width:16px; text-align:center; font-family:'IBM Plex Mono',monospace;
    font-weight:600; font-size:11px; color: var(--text-faint); flex-shrink:0;
  }
  .row.r1 .rk{ color: var(--brand); }
  .row.r2 .rk{ color: var(--silver); }
  .row.r3 .rk{ color: var(--bronze); }
  .r-avatar{
    width:22px; height:22px; border-radius:50%; flex-shrink:0; overflow:hidden;
    background: linear-gradient(145deg,#2A3F52,#1A2C3C);
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:10px; color:var(--text-dim);
  }
  .r-avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
  .r-avatar .avatar-fallback{ display:none; align-items:center; justify-content:center; width:100%; height:100%; }
  .rname{ flex:1; font-weight:600; color: var(--text); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rscore{ font-family:'IBM Plex Mono',monospace; font-weight:600; color: var(--text-dim); font-size:11.5px; text-align:right; flex-shrink:0; }
  .rgap{ font-family:'IBM Plex Mono',monospace; font-size:10px; color: var(--text-faint); text-align:right; min-width:52px; flex-shrink:0; }
  .rgap.first{ color: var(--good); }

  footer{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin-top: 30px; color: var(--text-faint); font-size:11.5px; font-weight:500;
  }
  .footer-logos{ display:flex; align-items:center; gap:2px; }
  .shell-badge{
    width:22px; height:22px; border-radius:6px; background:var(--shell-red);
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:10px; color:white;
  }
  .footer-logo{ height:20px; width:auto; display:none; }

  body.tv-rotate{ overflow:hidden; margin:0; }
  #tv-stage{
    position:fixed;
    top:50%; left:50%;
    width:100vh;
    height:100vw;
    overflow:hidden;
    transform-origin:center center;
    transform: translate(-50%,-50%) rotate(-90deg);
    opacity:0;
    transition: opacity 0.25s ease;
  }
  #tv-stage.tv-ready{ opacity:1; }
  #tv-stage .wrap{
    position:absolute;
    top:0; left:50%;
    width:100vh;
    max-width:none;
    margin:0;
    transform-origin: top center;
    transform: translateX(-50%);
  }

  body.tv-rotate .insights-link{ display:none; } /* interactive nav link, not relevant on an unattended TV display */
  body.tv-rotate .podium-card{ padding: 16px 20px 0; margin-bottom: 12px; }
  body.tv-rotate .podium-eyebrow{ margin-bottom: 12px; }
  body.tv-rotate .section-label{ margin: 14px 0 8px 2px; }
  body.tv-rotate .momentum{ gap: 8px; }
  body.tv-rotate .mom-card{ padding: 10px 12px; }
  body.tv-rotate .mom-head{ margin-bottom: 6px; }
  body.tv-rotate .mom-row{ padding: 5px 0; }
  body.tv-rotate .trends{ gap: 8px; }
  body.tv-rotate .trend-card{ padding: 10px 12px 8px; }
  body.tv-rotate .trend-head{ margin-bottom: 6px; }
  body.tv-rotate .bar-chart{ height: 90px; padding-top: 6px; }
  body.tv-rotate .spotlight-grid{ grid-template-columns: 1fr; gap: 8px; margin-bottom: 8px; }
  body.tv-rotate .spotlight{ padding: 12px 14px; gap: 12px; align-items: flex-start; }
  body.tv-rotate .m-ring{ margin-top: 2px; }
  body.tv-rotate .ml-row{ padding: 6px 14px; }
  body.tv-rotate .boards{ gap: 8px; }
  body.tv-rotate .board-head{ padding: 8px 12px 7px; }
  body.tv-rotate .row{ padding: 5px 12px; }
  body.tv-rotate .rgap{ display: none; }
  body.tv-rotate .rname{ display: none; }

  @media (max-width: 760px){
    .spotlight-grid{ grid-template-columns: 1fr; }
    .boards{ grid-template-columns: 1fr; }
    .momentum{ grid-template-columns: 1fr; }
    .trends{ grid-template-columns: 1fr; }
    .brand h1{ font-size:26px; }
    .ml-name{ width: 110px; }
  }  .err-banner{
    background: var(--bad-dim); border:1px solid var(--bad); color: var(--bad);
    border-radius: 10px; padding: 10px 16px; font-size:12.5px; font-weight:600;
    margin-bottom: 16px; display:none;
  }
  .empty-state{
    color: var(--text-faint); font-size:13px; text-align:center;
    padding: 24px 16px; grid-column: 1 / -1;
  }
  .section-tag{
    font-size:10px; font-weight:700; color: var(--text-faint); text-transform:none;
    letter-spacing:normal; margin-left:2px;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="err-banner" id="err-banner"></div>

  <header>
    <div class="brand-row">
      <img src="./assets/shell-rcs-logo.png" class="brand-logo" id="brand-logo" alt="" onerror="this.style.display='none'" onload="this.style.display='block'">
      <div class="brand">
        <h1>One<span>Track</span></h1>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <a href="./insights-dark.html" class="insights-link">Insights &rarr;</a>
      <div class="daterange" id="daterange">Loading…</div>
    </div>
  </header>

  <div class="podium-card">
    <div class="podium-eyebrow"><span class="icon" id="ic-trophy"></span>Department Champions</div>
    <div class="podium" id="podium"></div>
    <div class="podium-overflow" id="podium-overflow" style="display:none"></div>
  </div>

  <div class="momentum">
    <div class="mom-card">
      <div class="mom-head"><span class="icon" id="ic-improved" style="width:16px;height:16px;color:var(--good)"></span> Most Improved — this week</div>
      <div id="mom-improved"></div>
    </div>
    <div class="mom-card">
      <div class="mom-head"><span class="icon" id="ic-streak" style="width:16px;height:16px;color:var(--flame)"></span> Hot Streaks</div>
      <div id="mom-streaks"></div>
    </div>
  </div>

  <div class="section-label">Trends</div>
  <div class="trends">
    <div class="trend-card">
      <div class="trend-head">
        <span class="trend-title">Achievement Trend</span>
        <span class="trend-sub" id="trend-range">1 Jul – 10 Aug</span>
      </div>
      <svg id="trend-svg" width="100%" height="130" viewBox="0 0 640 130" preserveAspectRatio="none"></svg>
    </div>
    <div class="trend-card">
      <div class="trend-head">
        <span class="trend-title">Weekly Rhythm</span>
        <span class="trend-sub">avg by day</span>
      </div>
      <div class="bar-chart" id="weekly-bars"></div>
    </div>
  </div>

  <div class="section-label">Needs Attention <span class="section-tag">— this month</span></div>
  <div class="spotlight-grid" id="spotlight"></div>

  <div class="section-label">All Metrics <span class="section-tag">— this month</span></div>
  <div class="metric-list" id="metric-list"></div>

  <div class="section-label">Leaderboard <span class="section-tag">— this month</span></div>
  <div class="boards" id="boards-wrap">
    <!-- board columns injected dynamically, one per department -->
  </div>

  <footer>
    <div class="footer-logos">
      <img src="./assets/shell-logo.png" class="footer-logo" id="footer-logo" alt=""
        onerror="this.style.display='none'; document.getElementById('shell-badge-fallback').style.display='flex';"
        onload="this.style.display='block'; document.getElementById('shell-badge-fallback').style.display='none';">
      <div class="shell-badge" id="shell-badge-fallback" style="display:none">S</div>
      <img src="./assets/rcs-logo.png" class="footer-logo" id="footer-logo-rcs" alt=""
        onerror="this.style.display='none'"
        onload="this.style.display='block'">
    </div>
    <span id="footer-updated">Built with Google Sheets Data</span>
  </footer>

</div>

<script>
  const PROXY_URL = 'https://script.google.com/macros/s/AKfycbyEuxZ_SFPJv3cj7smgLtKn0NnQuAUyYNoBv6LXMP7gJduN4VxsnrLuekNhJnIrDQnb/exec';
  const REFRESH_MS = 5 * 60 * 1000;

  if (new URLSearchParams(location.search).get('tv') === '1') {
    document.body.classList.add('tv-rotate');
    const wrapEl = document.querySelector('.wrap');
    const stage = document.createElement('div');
    stage.id = 'tv-stage';
    wrapEl.parentNode.insertBefore(stage, wrapEl);
    stage.appendChild(wrapEl);
  }

  const METRIC_NAMES = [
    'Combo Bag','Promo Item','Shell Cafe CPD','Shell Cafe Combo',
    'Refresh CPD','Refresh Meal','Five Star Promo','Daily Fresh Sales','Customer Service','Toys'
  ];

  async function fetchTab(tabName) {
    const url = `${PROXY_URL}?sheet=${encodeURIComponent(tabName)}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`Could not load tab "${tabName}" (HTTP ${res.status})`);
    const parsed = await res.json();
    if (parsed.error) throw new Error(`Sheet error on "${tabName}": ${parsed.error}`);
    return { tabName: parsed.tabName, headers: parsed.headers, rows: parsed.rows };
  }

  function makeColFinder(tabName, headers) {
    const cache = {};
    const col = function(label, fallbackIdx) {
      if (cache[label] !== undefined) return cache[label];
      let idx = headers.findIndex(h => h.toLowerCase() === label.toLowerCase());
      if (idx === -1 && fallbackIdx !== undefined) idx = fallbackIdx;
      if (idx === -1) {
        throw new Error(`Column "${label}" not found in "${tabName}" — check the header row hasn't been renamed or removed.`);
      }
      cache[label] = idx;
      return idx;
    };
    col.any = function(labels) {
      for (const label of labels) {
        const idx = headers.findIndex(h => h.toLowerCase() === label.toLowerCase());
        if (idx !== -1) return idx;
      }
      throw new Error(`None of these columns were found in "${tabName}": ${labels.join(', ')} — check the header row.`);
    };
    return col;
  }

  function showError(msg) {
    const el = document.getElementById('err-banner');
    const isColumnError = /^Column "/.test(msg);
    el.textContent = isColumnError
      ? `⚠ ${msg}`
      : `⚠ ${msg} — check the Apps Script proxy is deployed and PROXY_URL is set correctly.`;
    el.style.display = 'block';
  }

  const ACRONYMS = new Set(['NFR']);

  function titleCase(s) {
    if (!s) return '';
    return String(s).trim().split(/\s+/)
      .map(w => {
        const upper = w.toUpperCase();
        if (ACRONYMS.has(upper)) return upper;
        return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
      })
      .join(' ');
  }

  function normKey(s) {
    return String(s || '').trim().toLowerCase();
  }

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  const ICONS = {
    bag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',
    tag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3h7a2 2 0 0 1 2 2v7a2 2 0 0 1-.6 1.4l-8 8a2 2 0 0 1-2.8 0l-6-6a2 2 0 0 1 0-2.8l8-8A2 2 0 0 1 11 3z"/><circle cx="16" cy="8" r="1.3" fill="currentColor" stroke="none"/></svg>',
    cup: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h11v6a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V9z"/><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8 5.5c0 1-1 1-1 2M12 5.5c0 1-1 1-1 2"/></svg>',
    combo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="14" r="5"/><path d="M15 8h4v9a3 3 0 0 1-3 3h-1V8z"/></svg>',
    droplet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>',
    meal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v7a2 2 0 0 0 2 2v9M7 3v9M9 3v7M17 3c-1.5 0-2 2-2 4s.5 4 2 4v9"/></svg>',
    star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6.1.6-4.6 4.1 1.3 6-5.4-3.1-5.4 3.1 1.3-6-4.6-4.1 6.1-.6L12 3z"/></svg>',
    leaf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4C10 4 4 10 4 18c8 0 14-6 14-14z"/><path d="M5 19c4-4 8-8 14-14"/></svg>',
    headset: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13a8 8 0 0 1 16 0"/><rect x="3" y="13" width="4" height="6" rx="1.5"/><rect x="17" y="13" width="4" height="6" rx="1.5"/><path d="M19 19v1a3 3 0 0 1-3 3h-3"/></svg>',
    block: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M4 7.5L12 12l8-4.5M12 12v9"/></svg>',
    trending: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>',
    flame: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c4 0 7-2.7 7-6.8 0-3-2-5-3.2-7.2C15 6.5 15 4.5 14 2c-1 2-3.5 4-4.5 7-1 3-4 4.6-4 8.2C5.5 19.3 8 22 12 22z"/><path d="M12 18c1.7 0 3-1.2 3-3 0-1.5-1-2.4-1.6-3.6-.4.8-1.4 1.4-2 2.4-.6 1-1.4 1.6-1.4 3.2 0 1.8 1.3 3 2 3z" fill="currentColor" stroke="none" opacity="0.35"/></svg>',
    trophy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M7 5H4v2a3 3 0 0 0 3 3M17 5h3v2a3 3 0 0 1-3 3"/><path d="M12 14v3"/><path d="M9 21h6"/><path d="M9.5 17h5l.5 4H9l.5-4z"/></svg>',
  };
  const METRIC_ICON = {
    'Combo Bag': 'bag', 'Promo Item': 'tag', 'Shell Cafe CPD': 'cup',
    'Shell Cafe Combo': 'combo', 'Refresh CPD': 'droplet', 'Refresh Meal': 'meal',
    'Five Star Promo': 'star', 'Daily Fresh Sales': 'leaf', 'Customer Service': 'headset', 'Toys': 'block',
  };
  function iconFor(name, cls) {
    const key = METRIC_ICON[name];
    return key ? `<span class="icon ${cls||''}">${ICONS[key]}</span>` : '';
  }

  const WREATH_SVG = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <path d="M 40.9 83.8 L 27.5 76.8 L 18.3 64.8 L 15.0 50.0 L 18.3 35.2 L 26.6 24.0"/>
    <path d="M 59.1 83.8 L 72.5 76.8 L 81.7 64.8 L 85.0 50.0 L 81.7 35.2 L 73.4 24.0"/>
    <ellipse cx="39.6" cy="88.6" rx="6.2" ry="2.4" transform="rotate(195 39.6 88.6)"/>
    <ellipse cx="24.3" cy="80.6" rx="6.2" ry="2.4" transform="rotate(220 24.3 80.6)"/>
    <ellipse cx="13.7" cy="66.9" rx="6.2" ry="2.4" transform="rotate(245 13.7 66.9)"/>
    <ellipse cx="10.0" cy="50.0" rx="6.2" ry="2.4" transform="rotate(270 10.0 50.0)"/>
    <ellipse cx="13.7" cy="33.1" rx="6.2" ry="2.4" transform="rotate(295 13.7 33.1)"/>
    <ellipse cx="23.2" cy="20.3" rx="6.2" ry="2.4" transform="rotate(318 23.2 20.3)"/>
    <ellipse cx="60.4" cy="88.6" rx="6.2" ry="2.4" transform="rotate(165 60.4 88.6)"/>
    <ellipse cx="75.7" cy="80.6" rx="6.2" ry="2.4" transform="rotate(140 75.7 80.6)"/>
    <ellipse cx="86.3" cy="66.9" rx="6.2" ry="2.4" transform="rotate(115 86.3 66.9)"/>
    <ellipse cx="90.0" cy="50.0" rx="6.2" ry="2.4" transform="rotate(90 90.0 50.0)"/>
    <ellipse cx="86.3" cy="33.1" rx="6.2" ry="2.4" transform="rotate(65 86.3 33.1)"/>
    <ellipse cx="76.8" cy="20.3" rx="6.2" ry="2.4" transform="rotate(42 76.8 20.3)"/>
  </svg>`;

  function avatarHTML(name, photoUrl, extraClass) {
    const initial = escapeHtml((name || '?').charAt(0).toUpperCase());
    const img = photoUrl
      ? `<img src="${escapeHtml(photoUrl)}" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">`
      : '';
    const fallbackDisplay = photoUrl ? '' : 'style="display:flex"';
    return `<div class="avatar-wrap">
      <div class="wreath">${WREATH_SVG}</div>
      <div class="avatar ${extraClass||''}">${img}<span class="avatar-fallback" ${fallbackDisplay}>${initial}</span></div>
    </div>`;
  }
  function miniAvatarHTML(name, photoUrl) {
    const initial = escapeHtml((name || '?').charAt(0).toUpperCase());
    const img = photoUrl
      ? `<img src="${escapeHtml(photoUrl)}" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">`
      : '';
    const fallbackDisplay = photoUrl ? '' : 'style="display:flex"';
    return `<div class="r-avatar">${img}<span class="avatar-fallback" ${fallbackDisplay}>${initial}</span></div>`;
  }

  function parseGvizDate(v) {
    if (v == null) return null;
    if (v instanceof Date) return v;
    const m = String(v).match(/Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?\)/);
    if (m) {
      return new Date(+m[1], +m[2], +m[3], +m[4]||0, +m[5]||0, +m[6]||0);
    }
    const d = new Date(v);
    return isNaN(d) ? null : d;
  }

  // Used by KPI Progress to match the same calendar-month-to-date window the
  // Podium/Leaderboard already use (via their own sheet-side formulas) — kept
  // consistent on purpose so every section of the dashboard represents the
  // same time period, rather than silently mixing different windows.
  function isCurrentMonth(d) {
    const now = new Date();
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  }

  async function loadDashboard() {
    document.getElementById('err-banner').style.display = 'none';

    const [winners, deptRanking, dailyInput, targetMaster, trend] = await Promise.all([
      fetchTab('Department_Winners_Clean'),
      fetchTab('Dept_Ranking_Clean'),
      fetchTab('Clean_Daily_Input'),
      fetchTab('Clean_Target_Master'),
      fetchTab('Achievement_Trend_Clean'),
    ]);

    renderPodium(winners);
    renderLeaderboard(deptRanking);
    renderMetrics(dailyInput, targetMaster);
    renderTrendAndWeekly(trend);
    renderMomentum(dailyInput);
    renderDateRange(dailyInput);

    document.getElementById('footer-updated').textContent =
      `Live from Google Sheets · Updated ${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`;

    fitTvDisplay();
  }

  let tvFitStarted = false;
  function fitTvDisplay() {
    if (!document.body.classList.contains('tv-rotate') || tvFitStarted) return;
    tvFitStarted = true;

    const wrap = document.querySelector('.wrap');

    setTimeout(() => {
      const budget = window.innerWidth;
      const contentH = wrap.scrollHeight;

      const scale = Math.min(1, budget / contentH);
      wrap.style.zoom = scale;
      wrap.style.transform = 'translateX(-50%)';

      document.getElementById('tv-stage').classList.add('tv-ready');
    }, 500);
  }

  function renderDateRange({ tabName, headers, rows }) {
    const col = makeColFinder(tabName, headers);
    const iDate = col('Date');
    const dates = rows.map(r => parseGvizDate(r[iDate])).filter(Boolean);
    if (!dates.length) return;
    const min = new Date(Math.min(...dates));
    const max = new Date(Math.max(...dates));
    const fmt = d => d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
    document.getElementById('daterange').textContent = `${fmt(min)} — ${fmt(max)}`;
  }

  function renderPodium({ tabName, headers, rows }) {
    const col = makeColFinder(tabName, headers);
    const iDept = col('Department');
    const iRank = col('Rank');
    const iShort = col('Shortname');
    const iScore = col.any(['Total Points', 'Total Items']);
    const iPhoto = col('Photo URL');

    const rank1Rows = rows
      .filter(r => r[iRank] === 1)
      .map(r => ({ dept: r[iDept], name: r[iShort], score: r[iScore] || 0, photo: r[iPhoto] || '' }))
      // A rank-1 row with a blank/missing department is a data error, not a
      // genuine 4th department — without this, it forms its own bogus group
      // below and can still bump a real department's champion into overflow.
      .filter(c => normKey(c.dept) !== '');

    // Group by NORMALIZED department rather than trusting the sheet to have
    // exactly one rank-1 row per department. If a stale or duplicate rank-1
    // tag ever ends up on a second row for the same department, this keeps
    // only the highest-scoring entry instead of letting the duplicate occupy
    // a podium slot and silently push a real department's champion into
    // overflow (or off the podium entirely).
    const byDept = {};
    rank1Rows.forEach(c => {
      const key = normKey(c.dept);
      if (!byDept[key] || c.score > byDept[key].score) byDept[key] = c;
    });
    const champions = Object.values(byDept)
      .sort((a,b) => String(a.dept).localeCompare(String(b.dept)));

    const top3 = champions.slice(0, 3);
    const overflow = champions.slice(3);
    const n = top3.length;

    const el = document.getElementById('podium');
    if (!champions.length) {
      el.style.gridTemplateColumns = '1fr';
      el.innerHTML = `<div class="empty-state">No department champions yet this month — check back once today's activity is logged.</div>`;
      document.getElementById('podium-overflow').style.display = 'none';
      return;
    }
    el.style.gridTemplateColumns = `repeat(${Math.max(n,1)}, 1fr)`;
    el.innerHTML = top3.map(c => `
      <div class="stand">
        <div class="dept-tag">${escapeHtml(titleCase(c.dept))}</div>
        ${avatarHTML(c.name, c.photo)}
        <div class="p-name">${escapeHtml(titleCase(c.name))}</div>
        <div class="p-score">${(c.score||0).toLocaleString()} pts</div>
        <div class="block"><span class="block-rank">Champion</span></div>
      </div>
    `).join('');

    const overflowEl = document.getElementById('podium-overflow');
    if (overflow.length) {
      overflowEl.style.display = 'flex';
      overflowEl.innerHTML = overflow.map(c => `
        <div class="champ-chip">
          ${avatarHTML(c.name, c.photo, 'chip-avatar')}
          <div class="chip-body">
            <div class="chip-dept">${escapeHtml(titleCase(c.dept))}</div>
            <div class="chip-name">${escapeHtml(titleCase(c.name))} · ${(c.score||0).toLocaleString()} pts</div>
          </div>
        </div>
      `).join('');
    } else {
      overflowEl.style.display = 'none';
      overflowEl.innerHTML = '';
    }
  }

  function renderLeaderboard({ tabName, headers, rows }) {
    const col = makeColFinder(tabName, headers);
    const iShort = col('Shortname', 0);
    const iDept = col('Department', 1);
    const iScore = col('sum', 2);
    const iPhoto = col('Photo URL');

    const byDept = {};
    rows.forEach(r => {
      const rawDept = r[iDept];
      const rawName = r[iShort];
      if (!rawDept || !rawName) return;
      const deptKey = normKey(rawDept);
      const nameKey = normKey(rawName);
      if (!byDept[deptKey]) byDept[deptKey] = { label: titleCase(rawDept), people: {} };
      if (!byDept[deptKey].people[nameKey]) {
        byDept[deptKey].people[nameKey] = { name: titleCase(rawName), score: 0, photo: r[iPhoto] || '' };
      }
      byDept[deptKey].people[nameKey].score += (r[iScore] || 0);
      if (!byDept[deptKey].people[nameKey].photo && r[iPhoto]) byDept[deptKey].people[nameKey].photo = r[iPhoto];
    });

    const wrap = document.getElementById('boards-wrap');
    wrap.innerHTML = '';
    Object.values(byDept).forEach(({ label, people }) => {
      const top5 = Object.values(people).sort((a,b) => b.score - a.score).slice(0, 5);
      const board = document.createElement('div');
      board.className = 'board';
      const rowsHtml = top5.map((r,i) => {
        const gap = i === 0 ? 'Leader' : `+${(top5[i-1].score - r.score).toLocaleString()} to #${i}`;
        return `<div class="row r${i+1}">
          <div class="rk">${i+1}</div>
          ${miniAvatarHTML(r.name, r.photo)}
          <div class="rname">${escapeHtml(r.name)}</div>
          <div class="rgap ${i===0?'first':''}">${gap}</div>
          <div class="rscore">${r.score.toLocaleString()}</div>
        </div>`;
      }).join('');
      board.innerHTML = `<div class="board-head">${escapeHtml(label)}</div>${rowsHtml}`;
      wrap.appendChild(board);
    });
    if (!Object.keys(byDept).length) {
      wrap.innerHTML = `<div class="empty-state">No leaderboard activity yet this month — check back once today's activity is logged.</div>`;
    }
  }

  function renderMetrics({ tabName: dailyTab, headers: dailyHeaders, rows: dailyInput },
                          { tabName: targetTab, headers: targetHeaders, rows: targetMaster }) {
    const dailyCol = makeColFinder(dailyTab, dailyHeaders);
    const targetCol = makeColFinder(targetTab, targetHeaders);
    const iDailyDate = dailyCol('Date');
    const iTargetDate = targetCol('Date');
    const dailyIdx = METRIC_NAMES.map(name => dailyCol(name));
    const targetIdx = METRIC_NAMES.map(name => targetCol(name));

    // Filtered to the current calendar month, matching the same window the
    // Podium/Leaderboard use — this section previously summed ALL-TIME history
    // with no date filter at all, which is exactly the inconsistency that made
    // the two dashboards report different numbers for "the same" KPIs.
    const monthDaily = dailyInput.filter(row => {
      const d = parseGvizDate(row[iDailyDate]);
      return d && isCurrentMonth(d);
    });
    const monthTarget = targetMaster.filter(row => {
      const d = parseGvizDate(row[iTargetDate]);
      return d && isCurrentMonth(d);
    });

    const spotlightEl = document.getElementById('spotlight');
    const listEl = document.getElementById('metric-list');
    if (!monthDaily.length) {
      spotlightEl.innerHTML = `<div class="empty-state">No KPI activity logged yet this month — check back once today's numbers are in.</div>`;
      listEl.innerHTML = '';
      return;
    }

    const actualTotals = METRIC_NAMES.map(() => 0);
    monthDaily.forEach(row => {
      dailyIdx.forEach((idx, i) => {
        const v = row[idx];
        if (typeof v === 'number') actualTotals[i] += v;
      });
    });

    const targetTotals = METRIC_NAMES.map(() => 0);
    monthTarget.forEach(row => {
      targetIdx.forEach((idx, i) => {
        const v = row[idx];
        if (typeof v === 'number') targetTotals[i] += v;
      });
    });

    const allMetrics = METRIC_NAMES.map((name, i) => ({ name, actual: actualTotals[i], target: targetTotals[i] }));
    const withTarget = allMetrics
      .filter(m => m.target > 0)
      .map(m => ({ ...m, pct: m.actual / m.target }))
      .sort((a,b) => a.pct - b.pct);
    const withoutTarget = allMetrics
      .filter(m => m.target <= 0)
      .map(m => ({ ...m, pct: null }));

    const spotlightCount = Math.min(3, withTarget.length);
    const spotlightItems = withTarget.slice(0, spotlightCount);
    const listItems = withTarget.slice(spotlightCount).concat(withoutTarget);
    const R = 22, C = 2*Math.PI*R;

    spotlightEl.innerHTML = '';
    spotlightItems.forEach(m => {
      const pctDisplay = Math.round(m.pct*100);
      const level = m.pct >= 1 ? 'good' : m.pct >= 0.7 ? 'warn' : 'bad';
      const dash = Math.min(m.pct,1) * C;
      const div = document.createElement('div');
      div.className = `spotlight ${level}`;
      div.innerHTML = `
        <div class="m-ring">
          <svg width="56" height="56">
            <circle class="bg" cx="28" cy="28" r="${R}" stroke-width="5" fill="none"/>
            <circle class="fg ${level}" cx="28" cy="28" r="${R}" stroke-width="5" fill="none"
              stroke-dasharray="${C}" stroke-dashoffset="${C - dash}"/>
          </svg>
          <div class="pct">${pctDisplay}%</div>
        </div>
        <div class="m-body">
          <span class="spot-tag">${level === 'bad' ? 'Below target' : 'Watch'}</span>
          <div class="m-name">${iconFor(m.name)}${m.name}</div>
          <div class="m-row">
            <span class="m-actual">${Math.round(m.actual).toLocaleString()}</span>
            <span class="m-target">/ ${Math.round(m.target).toLocaleString()}</span>
          </div>
        </div>
      `;
      spotlightEl.appendChild(div);
    });

    listEl.innerHTML = '';
    listItems.forEach(m => {
      const hasTarget = m.pct !== null;
      const pctDisplay = hasTarget ? Math.round(m.pct*100) : null;
      const level = !hasTarget ? 'warn' : (m.pct >= 1 ? 'good' : m.pct >= 0.7 ? 'warn' : 'bad');
      const barWidth = hasTarget ? Math.min(m.pct,1) * 100 : 0;
      const rightLabel = hasTarget ? `${pctDisplay}%` : 'No target';
      const numsLabel = hasTarget
        ? `${Math.round(m.actual).toLocaleString()} / ${Math.round(m.target).toLocaleString()}`
        : `${Math.round(m.actual).toLocaleString()} logged`;
      const row = document.createElement('div');
      row.className = 'ml-row';
      row.innerHTML = `
        <div class="ml-name">${iconFor(m.name)}${m.name}</div>
        <div class="ml-bar-track"><div class="ml-bar-fill ${level}" style="width:${barWidth}%"></div></div>
        <div class="ml-pct ${level}">${rightLabel}</div>
        <div class="ml-nums">${numsLabel}</div>
      `;
      listEl.appendChild(row);
    });
  }

  function renderTrendAndWeekly({ tabName, headers, rows: trend }) {
    const col = makeColFinder(tabName, headers);
    const iDate = col('Date');
    const iPct = col('Achievement %');
    const rows = trend
      .map(r => ({ date: parseGvizDate(r[iDate]), pct: r[iPct] }))
      .filter(r => r.date && typeof r.pct === 'number');
    const trendDates = rows.map(r => r.date.toLocaleDateString('en-GB', {day:'numeric', month:'short'}));
    const trendVals = rows.map(r => r.pct * 100);

    document.getElementById('trend-range').textContent =
      rows.length ? `${trendDates[0]} – ${trendDates[trendDates.length-1]}` : '';

    const svg = document.getElementById('trend-svg');
    const W = 640, H = 130, padL = 4, padR = 4, padT = 10, padB = 18;
    const capMax = 200;
    const capped = trendVals.map(v => Math.min(v, capMax));
    const n = capped.length;
    if (n < 2) { svg.innerHTML = ''; return; }
    const x = i => padL + (i/(n-1)) * (W - padL - padR);
    const y = v => padT + (1 - v/capMax) * (H - padT - padB);

    let pathD = capped.map((v,i)=> `${i===0?'M':'L'} ${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
    let fillD = pathD + ` L ${x(n-1).toFixed(1)} ${y(0).toFixed(1)} L ${x(0).toFixed(1)} ${y(0).toFixed(1)} Z`;

    svg.innerHTML = `
      <defs>
        <linearGradient id="lineGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#33D6A6" stop-opacity="0.45"/>
          <stop offset="100%" stop-color="#33D6A6" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <line x1="${padL}" y1="${y(100).toFixed(1)}" x2="${W-padR}" y2="${y(100).toFixed(1)}" class="avg-line"/>
      <text x="${W-padR}" y="${y(100)-4}" text-anchor="end" class="axis-label">100% target</text>
      <path d="${fillD}" class="line-fill"/>
      <path d="${pathD}" class="line-path"/>
      ${capped.map((v,i) => i % 4 === 0 || i === n-1 ? `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.5" class="line-dot"/>` : '').join('')}
      <text x="${padL}" y="${H-4}" class="axis-label">${trendDates[0]}</text>
      <text x="${W-padR}" y="${H-4}" text-anchor="end" class="axis-label">${trendDates[n-1]}</text>
    `;

    const order = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const sums = order.map(()=>0), counts = order.map(()=>0);
    rows.forEach(r => {
      const dow = r.date.getDay();
      sums[dow] += r.pct*100; counts[dow]++;
    });
    const mondayFirst = [1,2,3,4,5,6,0];
    const weeklyRhythm = mondayFirst.map(dow => ({
      day: order[dow],
      val: counts[dow] ? sums[dow]/counts[dow] : 0,
      weekend: dow === 0 || dow === 6,
    }));

    const barsEl = document.getElementById('weekly-bars');
    barsEl.innerHTML = '';
    const maxV = Math.max(...weeklyRhythm.map(d=>d.val), 1);
    weeklyRhythm.forEach(d => {
      const h = (d.val / maxV) * 100;
      const col = document.createElement('div');
      col.className = `bar-col ${d.weekend ? 'weekend' : ''}`;
      col.innerHTML = `
        <span class="bar-val">${Math.round(d.val)}%</span>
        <div class="bar-fill-el ${d.weekend ? 'weekend' : 'weekday'}" style="height:${h}%"></div>
        <span class="bar-day">${d.day}</span>
      `;
      barsEl.appendChild(col);
    });
  }

  function renderMomentum({ tabName, headers, rows: dailyInput }) {
    const col = makeColFinder(tabName, headers);
    const iDate = col('Date');
    const iName = col('Site Hero');
    const iActual = col('Weighted Points');
    const rows = dailyInput
      .map(r => ({ date: parseGvizDate(r[iDate]), rawName: r[iName], nameKey: normKey(r[iName]), actual: typeof r[iActual] === 'number' ? r[iActual] : 0 }))
      .filter(r => r.date && r.nameKey);

    if (!rows.length) {
      document.getElementById('mom-improved').innerHTML = `<div class="mom-row"><span class="mom-name" style="color:var(--text-faint)">No data yet</span></div>`;
      document.getElementById('mom-streaks').innerHTML = `<div class="mom-row"><span class="mom-name" style="color:var(--text-faint)">No data yet</span></div>`;
      return;
    }

    const byPerson = {};
    rows.forEach(r => {
      if (!byPerson[r.nameKey]) byPerson[r.nameKey] = { label: titleCase(r.rawName), entries: [] };
      byPerson[r.nameKey].entries.push(r);
    });

    const maxDate = new Date(Math.max(...rows.map(r => r.date)));
    const cutoff7 = new Date(maxDate); cutoff7.setDate(cutoff7.getDate() - 7);
    const cutoff14 = new Date(maxDate); cutoff14.setDate(cutoff14.getDate() - 14);

    const MIN_ACTIVE_DAYS = 3;
    const improved = Object.values(byPerson).map(({ label, entries }) => {
      const recentEntries = entries.filter(e => e.date > cutoff7 && e.actual > 0);
      const priorEntries = entries.filter(e => e.date > cutoff14 && e.date <= cutoff7 && e.actual > 0);
      const recentDays = recentEntries.length;
      const priorDays = priorEntries.length;
      const recentAvg = recentDays ? recentEntries.reduce((s,e)=>s+e.actual,0) / recentDays : 0;
      const priorAvg = priorDays ? priorEntries.reduce((s,e)=>s+e.actual,0) / priorDays : 0;
      const growth = priorAvg > 0 ? ((recentAvg - priorAvg) / priorAvg) * 100 : null;
      return { name: label, growth, recentDays, priorDays };
    }).filter(x => x.growth !== null && x.recentDays >= MIN_ACTIVE_DAYS && x.priorDays >= MIN_ACTIVE_DAYS && x.growth > 0)
      .sort((a,b) => b.growth - a.growth)
      .slice(0, 3);

    const improvedEl = document.getElementById('mom-improved');
    improvedEl.innerHTML = improved.length ? improved.map(x => `
      <div class="mom-row"><span class="mom-name">${escapeHtml(titleCase(x.name))}</span><span class="mom-val up">+${Math.round(x.growth)}%</span></div>
    `).join('') : `<div class="mom-row"><span class="mom-name" style="color:var(--text-faint)">Not enough history yet</span></div>`;

    const MAX_STREAK_CHECK = 90;
    const streaks = Object.values(byPerson).map(({ label, entries }) => {
      const daySet = new Set(entries.filter(e => e.actual > 0).map(e => e.date.toDateString()));
      let streak = 0;
      let cursor = new Date(maxDate);
      for (let i = 0; i < MAX_STREAK_CHECK; i++) {
        if (!daySet.has(cursor.toDateString())) break;
        streak++;
        cursor.setDate(cursor.getDate() - 1);
      }
      return { name: label, streak };
    }).filter(x => x.streak >= 2)
      .sort((a,b) => b.streak - a.streak)
      .slice(0, 3);

    const streaksEl = document.getElementById('mom-streaks');
    streaksEl.innerHTML = streaks.length ? streaks.map(x => `
      <div class="mom-row"><span class="mom-name">${escapeHtml(titleCase(x.name))}</span><span class="mom-val flame">🔥 ${x.streak}d</span></div>
    `).join('') : `<div class="mom-row"><span class="mom-name" style="color:var(--text-faint)">No active streaks yet</span></div>`;
  }

  document.getElementById('ic-improved').innerHTML = ICONS.trending;
  document.getElementById('ic-streak').innerHTML = ICONS.flame;
  document.getElementById('ic-trophy').innerHTML = ICONS.trophy;

  loadDashboard().catch(err => {
    console.error(err);
    showError(err.message || 'Could not load the dashboard data');
  });
  setInterval(() => {
    loadDashboard().catch(err => {
      console.error(err);
      showError(err.message || 'Could not refresh dashboard data');
    });
  }, REFRESH_MS);
</script>
